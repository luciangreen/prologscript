name: Pack

# Builds the pack (scripts/pack.mjs) on every push. On main it also publishes it as the GitHub
# release for package.json's version (v0.1.0, ...), with prologscript.html, prologscript.js and
# prologscript-pack.zip to download: made the first time, its files replaced after that. To start
# a new release, raise the version in package.json.
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Build the pack
        run: npm run pack
      - name: Check the pack
        run: node --test test/pack.test.js
      - uses: actions/upload-artifact@v4
        with:
          name: prologscript-pack
          path: dist/
      - name: Publish the release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(node -p "require('./package.json').version")"
          files="dist/prologscript.html dist/prologscript.js dist/prologscript-pack.zip"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" $files --clobber
          else
            gh release create "$tag" $files --target "$GITHUB_SHA" --title "PrologScript $tag" --notes-file dist/release-notes.md
          fi
